workflows:
  ios-workflow:
    name: iOS Build (RoboVM)
    max_build_duration: 120
    environment:
      groups:
        - codemagic_secrets
      vars:
        APP_ID: "com.beatdz.langlalau"
    scripts:
      - name: List ALL tasks
        script: |
          chmod +x gradlew
          ./gradlew :ios:tasks --all 2>&1
      - name: Build iOS
        script: |
          chmod +x gradlew
          ./gradlew :ios:build --info 2>&1 | tail -100
