workflows:
  ios-workflow:
    name: iOS Build (RoboVM)
    max_build_duration: 120
    environment:
      groups:
        - codemagic_secrets
      vars:
        APP_ID: "com.beatdz.langlalau"
    scripts:
      - name: Build iOS with RoboVM
        script: |
          chmod +x gradlew
          # Run all tasks including xcode project generation
          ./gradlew :ios:xcode :ios:build
          # List what was created
          find . -name "*.xcode*" -o -name "*.xcworkspace" -o -name "*.app" -o -name "*.ipa" 2>/dev/null | head -20
