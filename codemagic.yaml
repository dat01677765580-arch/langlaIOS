workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      groups:
        - codemagic_secrets
      vars:
        XCODE_WORKSPACE: "ios/TheGioiNhanGia.xcworkspace"
        XCODE_SCHEME: "TheGioiNhanGia"
        APP_ID: "com.beatdz.langlalau"
    artifacts:
      - ios/build/output/**/*.ipa
      - ios/build/reports/*.xml
    scripts:
      - name: Build iOS with RoboVM
        script: |
          chmod +x gradlew
          ./gradlew :ios:build
      - name: Build xcode project
        script: |
          cd ios
          xcodebuild build \
            -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
