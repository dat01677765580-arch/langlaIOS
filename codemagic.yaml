workflows:
  ios-workflow:
    name: iOS Build (RoboVM)
    max_build_duration: 120
    environment:
      groups:
        - codemagic_secrets
      vars:
        APP_ID: "com.beatdz.langlalau"
    scripts:
      - name: Downgrade Gradle to 6.9.4 for RoboVM
        script: |
          chmod +x gradlew
          sed -i '' 's/gradle-8.7-bin.zip/gradle-6.9.4-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
      - name: Build iOS
        script: |
          chmod +x gradlew
          ./gradlew :ios:tasks --all 2>&1 | head -100
      - name: Generate iOS
        script: |
          chmod +x gradlew
          ./gradlew :ios:xcode createIPA
