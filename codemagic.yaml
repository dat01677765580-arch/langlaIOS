workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    environment:
      groups:
        - codemagic_secrets
      vars:
        APP_ID: "com.beatdz.langlalau"
    scripts:
      - name: Use Gradle 7.6.4
        script: |
          sed -i '' 's/gradle-8.7-bin.zip/gradle-7.6.4-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
      - name: Build iOS
        script: |
          chmod +x gradlew
          ./gradlew :ios:tasks --all 2>&1 | head -50
