workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 120
    environment:
      groups:
        - codemagic_secrets
      vars:
        APP_ID: "com.beatdz.langlalau"
    scripts:
      - name: Restore Gradle version
        script: |
          # Use default Gradle 8.7
          sed -i '' 's/gradle-6.9.4-bin.zip/gradle-8.7-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
      - name: Build core module
        script: |
          chmod +x gradlew
          ./gradlew :core:build --info 2>&1 | tail -30
      - name: Build iOS module
        script: |
          chmod +x gradlew
          ./gradlew :ios:assemble --info 2>&1 | tail -30
